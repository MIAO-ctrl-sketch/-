<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孕期健康助手 - 雲端同步版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fef2f2; color: #4b5563; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #fee2e2; }
        .btn-pink { background: #f472b6; color: white; border-radius: 0.5rem; transition: all 0.2s; }
        .btn-pink:hover { background: #ec4899; }
        .tab-active { border-bottom: 3px solid #f472b6; color: #f472b6; font-weight: bold; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #f472b6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="pb-10">
    <div id="loading" class="loading-overlay">
        <div class="loader mb-4"></div>
        <div id="loading-text" class="text-pink-600 font-bold">雲端資料同步中...</div>
        <button onclick="document.getElementById('loading').remove()" class="mt-4 text-[10px] text-gray-400 underline">強制跳過讀取</button>
    </div>

    <div class="max-w-md mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-pink-600">孕期健康助手</h1>
            <div id="user-info" class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest">Initialising...</div>
        </header>

        <div class="flex border-b border-gray-200 mb-6 text-center text-sm">
            <button onclick="showPage('bmi')" id="btn-bmi" class="flex-1 py-2 tab-active">體重曲線</button>
            <button onclick="showPage('glu')" id="btn-glu" class="flex-1 py-2 text-gray-400">血糖紀錄</button>
            <button onclick="showPage('data')" id="btn-data" class="flex-1 py-2 text-gray-400">備份管理</button>
        </div>

        <!-- 體重分頁 -->
        <div id="page-bmi" class="space-y-4">
            <div class="card p-4">
                <h3 class="font-bold text-pink-600 mb-3 underline">1. 孕前基本設定</h3>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <input type="number" id="h" placeholder="身高 cm" class="border rounded p-2 text-sm">
                    <input type="number" id="w" placeholder="孕前體重 kg" class="border rounded p-2 text-sm">
                </div>
                <button onclick="saveProfile()" class="w-full btn-pink py-2 text-sm font-bold">儲存雲端設定</button>
                <div id="bmi-result" class="hidden mt-3 p-3 bg-pink-50 rounded text-xs text-pink-800 border border-pink-100"></div>
            </div>

            <div class="card p-4">
                <h3 class="font-bold text-gray-700 mb-3 text-sm">2. 每週體重紀錄</h3>
                <div class="flex gap-2 mb-4">
                    <input type="number" id="week" placeholder="週數" class="w-20 border rounded p-2 text-sm">
                    <input type="number" id="now-w" placeholder="目前 kg" class="flex-1 border rounded p-2 text-sm">
                    <button onclick="addWeight()" class="btn-pink px-4 text-sm font-bold">紀錄</button>
                </div>
                <canvas id="weightChart" class="mb-4"></canvas>
                <div id="weight-list" class="space-y-2 text-xs"></div>
            </div>
        </div>

        <!-- 血糖分頁 -->
        <div id="page-glu" class="hidden space-y-4">
            <div class="card p-4">
                <h3 class="font-bold text-gray-700 mb-3 text-sm">血糖即時紀錄</h3>
                <div class="space-y-3 text-sm">
                    <input type="datetime-local" id="glu-datetime" class="w-full border rounded p-2">
                    <select id="glu-time" class="w-full border rounded p-2">
                        <option value="fasting">晨起空腹 (標準 < 95)</option>
                        <option value="after2h">飯後 2 小時 (標準 < 120)</option>
                    </select>
                    <input type="number" id="glu-val" placeholder="血糖值 mg/dL" class="w-full border rounded p-2">
                    <button onclick="addGlu()" class="w-full btn-pink py-2 font-bold">儲存雲端紀錄</button>
                </div>
            </div>
            <div id="glu-list" class="space-y-2"></div>
        </div>

        <!-- 備份分頁 -->
        <div id="page-data" class="hidden">
            <div class="card p-6 text-center space-y-4">
                <h3 class="font-bold text-gray-700 text-sm">裝置專屬 ID</h3>
                <div id="full-user-id" class="text-[10px] font-mono break-all text-pink-600 bg-gray-50 p-2 border rounded">Loading...</div>
                <button onclick="exportData()" class="w-full btn-pink py-3 font-bold text-sm">匯出 CSV 報表</button>
                <button onclick="clearData()" class="w-full border border-gray-300 rounded py-2 text-[10px] text-gray-400">清空所有紀錄</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pregnancy-cloud-v1';

        let user = null;
        let userData = { profile: null, weights: [], glucoses: [] };
        let chart = null;

        async function startApp() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { 
                console.error("Auth Error", e);
                hideLoading(); 
            }
        }

        function hideLoading() {
            const el = document.getElementById('loading');
            if (el) el.remove();
        }

        onAuthStateChanged(auth, async (u) => {
            if (u) {
                user = u;
                document.getElementById('user-info').innerText = `Sync: ${u.uid.substring(0,8)}`;
                document.getElementById('full-user-id').innerText = u.uid;
                
                // 強制檢查與初始化資料，避免 onSnapshot 卡住
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main');
                try {
                    const snap = await getDoc(docRef);
                    if (!snap.exists()) {
                        await setDoc(docRef, { profile: null, weights: [], glucoses: [] });
                    }
                } catch (e) {
                    console.error("Init Doc Error", e);
                }
                
                syncData();
            }
        });

        function syncData() {
            if (!user) return;
            const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main');
            
            // 安全機制：5秒後若還沒載入就報錯並讓使用者進入
            const safetyTimeout = setTimeout(() => {
                const text = document.getElementById('loading-text');
                if (text) text.innerText = "同步緩慢，正嘗試直接進入...";
                setTimeout(hideLoading, 2000);
            }, 5000);

            onSnapshot(docRef, (snap) => {
                clearTimeout(safetyTimeout);
                if (snap.exists()) { 
                    userData = snap.data(); 
                }
                renderUI();
                hideLoading();
            }, (err) => {
                console.error("Sync Error", err);
                hideLoading();
            });
        }

        function getWeightAlert(currentW, week) {
            if (!userData.profile || !userData.profile.w) return null;
            const startW = userData.profile.w;
            const totalDiff = currentW - startW;

            const sortedWeights = [...(userData.weights || [])].sort((a,b) => a.week - b.week);
            const prevEntry = sortedWeights.filter(x => x.week < week).pop();
            const weeklyDiff = prevEntry ? (currentW - prevEntry.val) / (week - prevEntry.week) : 0;
            
            if (week <= 12) {
                if (totalDiff > 2) return { color: 'text-red-500', msg: '⚠️ 懷孕初期增重應控制在 1-2kg 內，避免進度過快以降低孕期風險。' };
                if (totalDiff <= 0) return { color: 'text-yellow-600', msg: '增重較慢，若醫師確認胎兒發展正常，請保持放鬆並規律進食。' };
            } else if (week <= 28) {
                const maxTotalMid = 2 + (week - 12) * 0.5;
                const isWeeklyFast = prevEntry && weeklyDiff > 0.5;
                const isTotalFast = totalDiff > maxTotalMid + 1;

                if (isWeeklyFast || isTotalFast) return { color: 'text-red-500', msg: '⚠️ 本週增重超過建議值（0.5kg），請留意飲食均衡並諮詢專業建議。' };
                if (totalDiff < (week - 12) * 0.2) return { color: 'text-yellow-600', msg: '增重較慢，若醫師確認胎兒發展正常，請保持放鬆並規律進食。' };
            } else {
                const maxTotalLate = 10 + (week - 28) * 0.5;
                const isWeeklyFast = prevEntry && weeklyDiff > 0.6;
                const isTotalFast = totalDiff > maxTotalLate + 1.5;

                if (isWeeklyFast || isTotalFast) return { color: 'text-red-500', msg: '⚠️ 本週增重超過建議值（0.5kg），請留意飲食均衡並諮詢專業建議。' };
                if (totalDiff < 8) return { color: 'text-yellow-600', msg: '增重較慢，若醫師確認胎兒發展正常，請保持放鬆並規律進食。' };
            }
            return null;
        }

        window.renderUI = () => {
            if(userData.profile) {
                const p = userData.profile;
                const res = document.getElementById('bmi-result');
                res.classList.remove('hidden');
                res.innerHTML = `<strong>孕前 BMI: ${p.bmi}</strong><br>${p.advice}`;
                document.getElementById('h').value = p.h * 100;
                document.getElementById('w').value = p.w;
            }

            const wList = document.getElementById('weight-list');
            const sortedW = [...(userData.weights || [])].sort((a,b) => b.week - a.week);
            wList.innerHTML = sortedW.map(x => {
                const alert = getWeightAlert(x.val, x.week);
                return `
                <div class="bg-white p-3 border-b">
                    <div class="flex justify-between items-center">
                        <span>第 ${x.week} 週: <strong>${x.val} kg</strong></span>
                        <button onclick="delWeight(${x.id})" class="text-red-300">✕</button>
                    </div>
                    ${alert ? `<p class="${alert.color} font-bold mt-1" style="font-size: 11px;">${alert.msg}</p>` : ''}
                </div>`
            }).join('');

            const gList = document.getElementById('glu-list');
            gList.innerHTML = (userData.glucoses || []).map(x => `
                <div class="card p-3 flex justify-between items-center border-l-4 ${x.isOver ? 'border-red-500' : 'border-green-500'} mb-2 text-xs">
                    <div><span class="text-gray-400">${x.date}</span><br><strong>${x.type}: ${x.val} mg/dL</strong></div>
                    <div class="flex items-center gap-2"><span>${x.status}</span><button onclick="delGlu(${x.id})" class="text-gray-300">✕</button></div>
                </div>`).join('');
            updateChart();
        };

        window.showPage = (p) => {
            ['bmi','glu','data'].forEach(x => {
                document.getElementById('page-'+x).classList.add('hidden');
                document.getElementById('btn-'+x).className = 'flex-1 py-2 text-gray-400';
            });
            document.getElementById('page-'+p).classList.remove('hidden');
            document.getElementById('btn-'+p).className = 'flex-1 py-2 tab-active';
        };

        window.saveProfile = async () => {
            const h = parseFloat(document.getElementById('h').value) / 100;
            const w = parseFloat(document.getElementById('w').value);
            if(!h || !w) return;
            const bmi = (w / (h * h)).toFixed(1);
            let advice = "建議體重增加10～14公斤較恰當，初期只需增加1～2公斤，中期約增加5～6公斤，每週建議增加約0.4-0.5公斤，後期平均增加4～6公斤，每週增加約0.5公斤。";
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { profile: { h, w, bmi, advice } });
        };

        window.addWeight = async () => {
            const week = parseInt(document.getElementById('week').value);
            const val = parseFloat(document.getElementById('now-w').value);
            if(!week || !val) return;
            const weights = [...(userData.weights || []), { id: Date.now(), week, val }];
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { weights });
            document.getElementById('week').value = ''; document.getElementById('now-w').value = '';
        };

        window.delWeight = async (id) => {
            const weights = userData.weights.filter(x => x.id !== id);
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { weights });
        };

        window.addGlu = async () => {
            const dt = document.getElementById('glu-datetime').value;
            const val = parseFloat(document.getElementById('glu-val').value);
            const type = document.getElementById('glu-time').value;
            if(!val || !dt) return;
            const isOver = (type === 'fasting' && val >= 95) || (type === 'after2h' && val >= 120);
            const glucoses = [{ id: Date.now(), date: dt.replace('T', ' '), val, type: type === 'fasting' ? '空腹' : '飯後2h', isOver, status: isOver ? '⚠️ 偏高' : '正常' }, ...(userData.glucoses || [])];
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { glucoses });
            document.getElementById('glu-val').value = '';
        };

        window.delGlu = async (id) => {
            const glucoses = userData.glucoses.filter(x => x.id !== id);
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { glucoses });
        };

        function updateChart() {
            const ctx = document.getElementById('weightChart');
            if (!ctx) return;
            if(chart) chart.destroy();
            const data = [...(userData.weights || [])].sort((a,b) => a.week - b.week);
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(x => 'W'+x.week),
                    datasets: [{ data: data.map(x => x.val), borderColor: '#f472b6', tension: 0.3 }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        }

        window.exportData = () => {
            let csv = "\ufeff日期,類型,詳情,數值,狀態\n";
            (userData.weights || []).forEach(x => csv += `-,體重,第${x.week}週,${x.val}kg,-\n`);
            (userData.glucoses || []).forEach(x => csv += `${x.date},血糖,${x.type},${x.val}mg/dL,${x.status}\n`);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = '數據報表.csv'; a.click();
        };

        window.clearData = async () => {
            if(confirm("確定刪除雲端所有紀錄？")) {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'health', 'main'), { profile: null, weights: [], glucoses: [] });
            }
        };

        startApp();
    </script>
</body>
</html>
