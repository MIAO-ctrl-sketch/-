<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孕期全方位健康管理工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #fdf2f8; color: #4b5563; }
        .card { background: white; border-radius: 1.25rem; box-shadow: 0 4px 15px rgba(244, 114, 182, 0.15); border: 1px solid #fce7f3; }
        .tab-btn { transition: all 0.3s; border-bottom: 3px solid transparent; }
        .tab-btn.active { border-bottom: 3px solid #f472b6; color: #f472b6; font-weight: bold; }
        .input-style { width: 100%; border: 1px solid #fbcfe8; border-radius: 0.75rem; padding: 0.6rem; outline: none; transition: ring 0.2s; }
        .input-style:focus { ring: 2px solid #f9a8d4; }
        .btn-primary { background: #f472b6; color: white; border-radius: 0.75rem; padding: 0.75rem; font-weight: bold; transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-outline { border: 1.5px solid #f472b6; color: #f472b6; border-radius: 0.75rem; padding: 0.75rem; font-weight: bold; }
        .alert-box { border-radius: 0.75rem; padding: 1rem; font-size: 0.875rem; }
        .delete-btn { color: #fca5a5; cursor: pointer; transition: color 0.2s; }
        .delete-btn:hover { color: #ef4444; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div class="max-w-md mx-auto p-4">
        <!-- Header -->
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold text-pink-600">🤰 孕期健康管理助手</h1>
            <p class="text-sm text-pink-400">產科護理師專業監製</p>
        </header>

        <!-- Tabs -->
        <div class="flex justify-around mb-6 bg-white rounded-xl shadow-sm p-1">
            <button onclick="showTab('bmi')" id="tab-bmi" class="tab-btn py-3 px-4 flex-1 active">體重追蹤</button>
            <button onclick="showTab('glucose')" id="tab-glucose" class="tab-btn py-3 px-4 flex-1">血糖紀錄</button>
            <button onclick="showTab('export')" id="tab-export" class="tab-btn py-3 px-4 flex-1 text-gray-400">匯出資料</button>
        </div>

        <!-- BMI & Weight Section -->
        <div id="content-bmi" class="space-y-6">
            <div class="card p-5">
                <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="text-pink-500">📏</span> 孕前設定
                </h2>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-xs text-gray-500">身高 (cm)</label>
                        <input type="number" id="pre-height" class="input-style" placeholder="160">
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">孕前體重 (kg)</label>
                        <input type="number" id="pre-weight" class="input-style" placeholder="55">
                    </div>
                </div>
                <button onclick="saveProfile()" class="w-full btn-primary text-sm">儲存設定</button>
                <div id="bmi-info" class="hidden mt-4 alert-box bg-pink-50 text-pink-700"></div>
            </div>

            <div class="card p-5">
                <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="text-pink-500">📈</span> 增加紀錄
                </h2>
                <div class="flex gap-2 items-end mb-4">
                    <div class="flex-1">
                        <label class="text-xs text-gray-500">週數</label>
                        <input type="number" id="week-num" class="input-style" placeholder="12">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-500">體重 (kg)</label>
                        <input type="number" id="curr-weight" class="input-style" placeholder="58">
                    </div>
                    <button onclick="addWeightRecord()" class="btn-primary px-4">儲存</button>
                </div>
                <div id="weight-history" class="space-y-2"></div>
            </div>
        </div>

        <!-- Glucose Section -->
        <div id="content-glucose" class="hidden space-y-6">
            <div class="card p-5">
                <h2 class="font-bold text-lg mb-4 flex items-center gap-2">
                    <span class="text-pink-500">🩸</span> 血糖紀錄
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs text-gray-500">時段</label>
                        <select id="glu-period" class="input-style">
                            <option value="fasting">晨起空腹</option>
                            <option value="breakfast_2h">早餐後 2h</option>
                            <option value="lunch_2h">午餐後 2h</option>
                            <option value="dinner_2h">晚餐後 2h</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-gray-500">數值 (mg/dL)</label>
                        <input type="number" id="glu-value" class="input-style" placeholder="90">
                    </div>
                    <button onclick="addGlucoseRecord()" class="w-full btn-primary">儲存數值</button>
                </div>
            </div>
            <div id="glucose-history" class="space-y-2"></div>
        </div>

        <!-- Export Section -->
        <div id="content-export" class="hidden space-y-6">
            <div class="card p-8 text-center">
                <div class="mb-6">
                    <span class="text-5xl">📊</span>
                    <h2 class="text-xl font-bold mt-4">資料匯出中心</h2>
                    <p class="text-sm text-gray-400 mt-2">點擊下方按鈕將紀錄存成 CSV 檔案，<br>您可以直接傳給護理師或醫師看。</p>
                </div>
                <button onclick="exportToCSV()" class="w-full btn-primary mb-3">一鍵匯出 CSV 檔案</button>
                <button onclick="clearAllData()" class="w-full text-xs text-red-400 mt-8 underline">清空所有本地資料</button>
            </div>
        </div>

        <footer class="mt-8 text-center text-xs text-gray-400 px-4">
            <p>※ 本程式僅供居家健康紀錄參考，數據儲存於您的手機內 ※</p>
        </footer>
    </div>

    <script>
        let profile = JSON.parse(localStorage.getItem('preg_profile')) || null;
        let weightData = JSON.parse(localStorage.getItem('preg_weight')) || [];
        let glucoseData = JSON.parse(localStorage.getItem('preg_glucose')) || [];

        function showTab(tab) {
            ['bmi', 'glucose', 'export'].forEach(t => {
                document.getElementById(`content-${t}`).classList.toggle('hidden', t !== tab);
                document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
            });
        }

        function saveProfile() {
            const h = document.getElementById('pre-height').value / 100;
            const w = document.getElementById('pre-weight').value;
            if(!h || !w) return alert("請輸入完整身高體重");
            const bmi = (w / (h * h)).toFixed(1);
            let category = "", target = "", weeklyTarget = 0;
            if (bmi < 18.5) { category = "過輕"; target = "12.5-18kg"; weeklyTarget = 0.5; }
            else if (bmi < 24.9) { category = "正常"; target = "11.5-16kg"; weeklyTarget = 0.4; }
            else if (bmi < 29.9) { category = "過重"; target = "7-11.5kg"; weeklyTarget = 0.3; }
            else { category = "肥胖"; target = "5-9kg"; weeklyTarget = 0.2; }
            profile = { bmi, category, target, weeklyTarget, preWeight: w };
            localStorage.setItem('preg_profile', JSON.stringify(profile));
            renderProfile();
        }

        function renderProfile() {
            if(!profile) return;
            const info = document.getElementById('bmi-info');
            info.classList.remove('hidden');
            info.innerHTML = `<p><strong>孕前 BMI: ${profile.bmi} (${profile.category})</strong></p><p>建議增重範圍: <strong>${profile.target}</strong></p>`;
            document.getElementById('pre-height').value = Math.round(Math.sqrt(profile.preWeight/profile.bmi)*100);
            document.getElementById('pre-weight').value = profile.preWeight;
        }

        function addWeightRecord() {
            const week = document.getElementById('week-num').value;
            const weight = document.getElementById('curr-weight').value;
            if(!week || !weight || !profile) return alert("請先設定孕前資料");
            let status = "正常", color = "text-green-500", bColor = "border-green-400";
            if (weightData.length > 0) {
                const diff = (weight - weightData[0].weight) / (week - weightData[0].week);
                if (diff > profile.weeklyTarget + 0.2) { status = "增重過快"; color = "text-red-500"; bColor = "border-red-400"; }
                else if (diff < profile.weeklyTarget - 0.3 && week > 12) { status = "增重較慢"; color = "text-yellow-500"; bColor = "border-yellow-400"; }
            }
            weightData.unshift({ id: Date.now(), week, weight, status, color, bColor, date: new Date().toLocaleDateString() });
            localStorage.setItem('preg_weight', JSON.stringify(weightData));
            renderWeightRecords();
            document.getElementById('week-num').value = ""; document.getElementById('curr-weight').value = "";
        }

        function deleteRecord(type, id) {
            if(!confirm("確定要刪除這筆紀錄嗎？")) return;
            if(type === 'weight') {
                weightData = weightData.filter(r => r.id !== id);
                localStorage.setItem('preg_weight', JSON.stringify(weightData));
                renderWeightRecords();
            } else {
                glucoseData = glucoseData.filter(r => r.id !== id);
                localStorage.setItem('preg_glucose', JSON.stringify(glucoseData));
                renderGlucoseRecords();
            }
        }

        function renderWeightRecords() {
            const container = document.getElementById('weight-history');
            container.innerHTML = weightData.map(r => `
                <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border-l-4 ${r.bColor} shadow-sm">
                    <div><span class="font-bold">第 ${r.week} 週</span> <span class="ml-2">${r.weight} kg</span></div>
                    <div class="flex items-center gap-3 text-right">
                        <div><p class="${r.color} font-bold text-xs">${r.status}</p><p class="text-[10px] text-gray-400">${r.date}</p></div>
                        <span onclick="deleteRecord('weight', ${r.id})" class="delete-btn text-lg">🗑️</span>
                    </div>
                </div>
            `).join('');
        }

        function addGlucoseRecord() {
            const period = document.getElementById('glu-period').value;
            const val = document.getElementById('glu-value').value;
            if(!val) return;
            let status = "正常", color = "border-green-400", textColor = "text-green-500";
            if ((period === 'fasting' && val >= 95) || (period !== 'fasting' && val >= 120)) { status = "超標"; color = "border-red-400"; textColor = "text-red-500"; }
            const labels = { fasting: "空腹", breakfast_2h: "餐後2h(早)", lunch_2h: "餐後2h(午)", dinner_2h: "餐後2h(晚)" };
            glucoseData.unshift({ id: Date.now(), label: labels[period], val, status, color, textColor, date: new Date().toLocaleDateString() });
            localStorage.setItem('preg_glucose', JSON.stringify(glucoseData));
            renderGlucoseRecords();
            document.getElementById('glu-value').value = "";
        }

        function renderGlucoseRecords() {
            const container = document.getElementById('glucose-history');
            container.innerHTML = glucoseData.map(r => `
                <div class="flex justify-between items-center bg-white border ${r.color} p-3 rounded-lg shadow-sm">
                    <div><span class="text-xs text-gray-400">${r.label}</span><p class="font-bold text-lg">${r.val} <span class="text-xs font-normal">mg/dL</span></p></div>
                    <div class="flex items-center gap-3 text-right">
                        <div><span class="${r.textColor} font-bold">${r.status}</span><p class="text-[10px] text-gray-400">${r.date}</p></div>
                        <span onclick="deleteRecord('glucose', ${r.id})" class="delete-btn text-lg">🗑️</span>
                    </div>
                </div>
            `).join('');
        }

        function exportToCSV() {
            if (weightData.length === 0 && glucoseData.length === 0) return alert("尚無資料可匯出");
            let csvContent = "\ufeff日期,類別,項目,數值,狀態\n";
            weightData.forEach(r => csvContent += `${r.date},體重追蹤,第${r.week}週,${r.weight}kg,${r.status}\n`);
            glucoseData.forEach(r => csvContent += `${r.date},血糖紀錄,${r.label},${r.val}mg/dL,${r.status}\n`);
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `孕期健康紀錄_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        function clearAllData() {
            if(confirm("確定要清空所有資料嗎？這動作無法復原。")) {
                localStorage.clear(); location.reload();
            }
        }

        renderProfile(); renderWeightRecords(); renderGlucoseRecords();
    </script>
</body>
</html>
